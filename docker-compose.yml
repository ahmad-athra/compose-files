version: '3.8'

services:
  prometheus0_eu1:
    container_name: prometheus0_eu1
    restart: unless-stopped
    image: prom/prometheus:v3.4.1
    user: root
    networks:
      - prometheus_network
    # network_mode: host # Use host network stack
    volumes:
      # - ./prometheus0_eu1_data:/etc/prometheus
      - prometheus-storage:/prometheus
      - ./prometheus0_eu1.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9090'
      # - "--web.external-url=https://8d91acbb5065-10-244-8-65-9090.spch.r.killercoda.com"
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - 9090:9090

  thanos_sidecar_eu1:
    container_name: prometheus-0-sidecar-eu1
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    restart: unless-stopped
    networks:
      - prometheus_network
    depends_on:
      - prometheus0_eu1
    volumes:
      - ./prometheus0_eu1.yml:/etc/prometheus/prometheus.yml
    command:
      - sidecar
      - --http-address=0.0.0.0:19090
      - --grpc-address=0.0.0.0:19190
      - --reloader.config-file=/etc/prometheus/prometheus.yml
      - --prometheus.url=http://prometheus0_eu1:9090
    ports:
      - 19090:19090
      - 19190:19190

