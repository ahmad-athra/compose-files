version: '3.8'

services:
  # --------------------------------------- [minio OCS]
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    networks:
      - minio-network
      - prometheus_network
    volumes:
      - minio-storage:/data
  # ---------------------------------------
  # --------------------------------------- [prometheus0_eu1]
  prometheus0_eu1:
    container_name: prometheus0_eu1
    # restart: unless-stopped
    image: prom/prometheus:v3.4.1
    user: root
    networks:
      - prometheus_network
    # network_mode: host # Use host network stack
    volumes:
      # - ./prometheus0_eu1_data:/etc/prometheus
      - prometheus0-eu1-storage:/prometheus
      - ./prometheus0_eu1.yml:/etc/prometheus/prometheus.yml:ro
      - ./node_exporter.crt:/etc/node_exporter/node_exporter.crt:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9090'
      # - "--web.external-url=https://8d91acbb5065-10-244-8-65-9090.spch.r.killercoda.com"
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --storage.tsdb.min-block-duration=15m
      - --storage.tsdb.max-block-duration=15m
      - --storage.tsdb.retention.time=12h
    ports:
      - 9090:9090

  thanos_sidecar_eu1:
    container_name: prometheus-0-sidecar-eu1
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    restart: unless-stopped
    networks:
      - prometheus_network
    depends_on:
      - prometheus0_eu1
    volumes:
      - ./prometheus0_eu1.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/bucket-storage.yml:/etc/thanos/minio-bucket.yml:ro
      - prometheus0-eu1-storage:/prometheus
    command:
      - sidecar
      - --http-address=0.0.0.0:19090
      - --grpc-address=0.0.0.0:19190
      - --reloader.config-file=/etc/prometheus/prometheus.yml
      - --reloader.watch-interval=15s # default 3m
      - --prometheus.url=http://prometheus0_eu1:9090
      - --objstore.config-file=/etc/thanos/minio-bucket.yml
      - --tsdb.path=/prometheus

      - --shipper.upload-compacted # Upload compacted blocks to the object store, just for first time
    ports:
      - 19090:19090
      - 19190:19190

  # --------------------------------------- [prometheus0_us1]
  prometheus0_us1:
    container_name: prometheus0_us1
    # restart: unless-stopped
    image: prom/prometheus:v3.4.1
    user: root
    networks:
      - prometheus_network
    # network_mode: host # Use host network stack
    volumes:
      # - ./prometheus0_us1_data:/etc/prometheus
      - prometheus0-us1-storage:/prometheus
      - ./prometheus0_us1.yml:/etc/prometheus/prometheus.yml:ro
      # - ./node_exporter.crt:/etc/node_exporter/node_exporter.crt:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9090'
      # - "--web.external-url=https://8d91acbb5065-10-244-8-65-9090.spch.r.killercoda.com"
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - --storage.tsdb.min-block-duration=15h
      - --storage.tsdb.max-block-duration=15h
      - --storage.tsdb.retention.time=12h
    ports:
      - 9091:9090

  thanos_sidecar0_us1:
    container_name: prometheus-0-sidecar-us1
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    restart: unless-stopped
    networks:
      - prometheus_network
    depends_on:
      - prometheus0_us1
    volumes:
      - ./prometheus0_us1.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/bucket-storage.yml:/etc/thanos/minio-bucket.yml:ro
      - prometheus0-us1-storage:/prometheus
    command:
      - sidecar
      - --http-address=0.0.0.0:19090
      - --grpc-address=0.0.0.0:19190
      - --reloader.config-file=/etc/prometheus/prometheus.yml
      - --reloader.watch-interval=15s # default 3m
      - --prometheus.url=http://prometheus0_us1:9090
      - --objstore.config-file=/etc/thanos/minio-bucket.yml
      - --tsdb.path=/prometheus

      - --shipper.upload-compacted # Upload compacted blocks to the object store, just for first time

    ports:
      - 19091:19090
      - 19191:19190

  # --------------------------------------- [prometheus1_us1]
  prometheus1_us1:
    container_name: prometheus1_us1
    # restart: unless-stopped
    image: prom/prometheus:v3.4.1
    user: root
    networks:
      - prometheus_network
    # network_mode: host # Use host network stack
    volumes:
      # - ./prometheus1_us1_data:/etc/prometheus
      - prometheus1-us1-storage:/prometheus
      - ./prometheus1_us1.yml:/etc/prometheus/prometheus.yml:ro
      # - ./node_exporter.crt:/etc/node_exporter/node_exporter.crt:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.listen-address=:9090'
      # - "--web.external-url=https://8d91acbb5065-10-244-8-65-9090.spch.r.killercoda.com"
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - --storage.tsdb.min-block-duration=15m
      - --storage.tsdb.max-block-duration=15m
      - --storage.tsdb.retention.time=12h
    ports:
      - 9092:9090

  thanos_sidecar1_us1:
    container_name: prometheus-1-sidecar-us1
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    restart: unless-stopped
    networks:
      - prometheus_network
    depends_on:
      - prometheus1_us1
    volumes:
      - ./prometheus1_us1.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/bucket-storage.yml:/etc/thanos/minio-bucket.yml:ro
      - prometheus1-us1-storage:/prometheus
    command:
      - sidecar
      - --http-address=0.0.0.0:19090
      - --grpc-address=0.0.0.0:19190
      - --reloader.config-file=/etc/prometheus/prometheus.yml
      - --reloader.watch-interval=15s # default 3m
      - --prometheus.url=http://prometheus1_us1:9090
      - --objstore.config-file=/etc/thanos/minio-bucket.yml
      - --tsdb.path=/prometheus

      - --shipper.upload-compacted # Upload compacted blocks to the object store, just for first time
    ports:
      - 19092:19090
      - 19192:19190

  # --------------------------------------- [thanos_querier]
  thanos_querier:
    container_name: thanos_query
    image: quay.io/thanos/thanos:v0.39.1
    networks:
      - prometheus_network
    restart: unless-stopped
    depends_on:
      - thanos_sidecar_eu1
      - thanos_sidecar0_us1
      - thanos_sidecar1_us1
      - thanos_store_gateway
    ports:
      - 29090:29090
    command:
      - 'query'
      - '--http-address=0.0.0.0:29090'
      - '--query.replica-label=replica'
      - '--endpoint=thanos_sidecar_eu1:19190'
      - '--endpoint=thanos_sidecar0_us1:19190'
      - '--endpoint=thanos_sidecar1_us1:19190'
      - '--endpoint=thanos_store_gateway:19191'

      # - "--store=dnssrv+thanos_sidecar_eu1:19190"
    # # environment:
    #   - --http-address=0.0.0.0:29090
    #   - --query.replica-label=replica
    #   # - --store=dnssrv+thanos_sidecar_eu1:19190
    #   - --store=thanos_sidecar_eu1:19190

  #---------------------------------------- [Store Gateway]
  thanos_store_gateway:
    container_name: thanos_store_gateway
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    networks:
      - prometheus_network
    restart: unless-stopped
    depends_on:
      - thanos_sidecar_eu1
      - thanos_sidecar0_us1
      - thanos_sidecar1_us1
      - minio
    volumes:
      - ./config/bucket-storage.yml:/etc/thanos/minio-bucket.yml:ro
    ports:
      - 19094:19091
      - 19194:19191
    command:
      - 'store'
      - --objstore.config-file=/etc/thanos/minio-bucket.yml
      - --http-address=0.0.0.0:19091
      - --grpc-address=0.0.0.0:19191

  thanos_compactor:
    container_name: thanos_compactor
    image: quay.io/thanos/thanos:v0.39.1
    user: root
    volumes:
      - ./config/bucket-storage.yml:/etc/thanos/minio-bucket.yml:ro
    ports:
      - 19095:19095
    networks:
      - prometheus_network
      - minio-network
    restart: unless-stopped
    command:
      - 'compact'
      - --wait
      - --wait-interval=30s
      - --objstore.config-file=/etc/thanos/minio-bucket.yml
      - --consistency-delay=0s
      - --data-dir=/thanos/compact
      - --http-address=0.0.0.0:19095

volumes:
  minio-storage: {}
  prometheus0-eu1-storage: {}
  prometheus0-us1-storage: {}
  prometheus1-us1-storage: {}

networks:
  prometheus_network:
  minio-network:
