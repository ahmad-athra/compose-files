global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: us1
    replica: 1

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091', 'localhost:9092']
  - job_name: 'sidecar'
    static_configs:
      - targets: ['thanos_sidecar0_us1:19091', 'thanos_sidecar1_us1:19092']
