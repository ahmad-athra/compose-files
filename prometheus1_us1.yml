global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: us1
    replica: 1

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus0_us1:9090', 'prometheus1_us1:9090']
  - job_name: 'sidecar'
    static_configs:
      - targets: ['thanos_sidecar0_us1:19090', 'thanos_sidecar1_us1:19090']

---

```mermaid
flowchart TD
    subgraph prometheus_network
        P0EU1[Prometheus<br/>prometheus0_eu1<br/>:9090]
        TSC_EU1[Thanos Sidecar<br/>thanos_sidecar_eu1<br/>:19090/:19190]

        P0US1[Prometheus<br/>prometheus0_us1<br/>:9090]
        TSC0_US1[Thanos Sidecar<br/>thanos_sidecar0_us1<br/>:19090/:19190]

        P1US1[Prometheus<br/>prometheus1_us1<br/>:9090]
        TSC1_US1[Thanos Sidecar<br/>thanos_sidecar1_us1<br/>:19090/:19190]

        TQF[Thanos Query Frontend<br/>thanos_query_frontend<br/>:20902]
        TQ[Thanos Querier<br/>thanos_querier<br/>:29090]
        TSGW[Thanos Store Gateway<br/>thanos_store_gateway<br/>:19091/:19191]
        TC[Thanos Compactor<br/>thanos_compactor<br/>:19095]
        MINIO[MinIO<br/>minio<br/>:9000/:9001]
        GF[Grafana<br/>grafana-lab<br/>:3000]
    end

    %% Prometheus <-> Sidecar
    P0EU1 -- "scraped by" --> TSC_EU1
    TSC_EU1 -- "depends_on" --> P0EU1

    P0US1 -- "scraped by" --> TSC0_US1
    TSC0_US1 -- "depends_on" --> P0US1

    P1US1 -- "scraped by" --> TSC1_US1
    TSC1_US1 -- "depends_on" --> P1US1

    %% Sidecars <-> Querier
    TSC_EU1 -- gRPC --> TQ
    TSC0_US1 -- gRPC --> TQ
    TSC1_US1 -- gRPC --> TQ
    TSGW -- gRPC --> TQ

    %% Query Frontend <-> Querier
    TQF -- HTTP --> TQ

    %% Grafana <-> Query Frontend
    GF -- HTTP --> TQF

    %% Store Gateway <-> MinIO
    TSGW -- S3 API --> MINIO
    TC -- S3 API --> MINIO

    %% Volumes
    V1[(prometheus0-eu1-storage)]
    V2[(prometheus0-us1-storage)]
    V3[(prometheus1-us1-storage)]
    VM[(minio-storage)]
    VG[(grafana-storage)]
    P0EU1 --- V1
    P0US1 --- V2
    P1US1 --- V3
    MINIO --- VM
    GF --- VG

    %% Configs
    CFG1[[prometheus0_eu1.yml]]
    CFG2[[prometheus0_us1.yml]]
    CFG3[[prometheus1_us1.yml]]
    BCFG[[bucket-storage.yml]]
    FCFG[[frontend.yml]]
    P0EU1 --- CFG1
    TSC_EU1 --- CFG1
    P0US1 --- CFG2
    TSC0_US1 --- CFG2
    P1US1 --- CFG3
    TSC1_US1 --- CFG3
    TSC_EU1 --- BCFG
    TSC0_US1 --- BCFG
    TSC1_US1 --- BCFG
    TSGW --- BCFG
    TC --- BCFG
    TQF --- FCFG
```
