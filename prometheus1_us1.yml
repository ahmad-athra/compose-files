global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: us1
    replica: 1

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus0_us1:9090', 'prometheus1_us1:9090']
  - job_name: 'sidecar'
    static_configs:
      - targets: ['thanos_sidecar0_us1:19090', 'thanos_sidecar1_us1:19090']
