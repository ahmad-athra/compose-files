global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: eu1
    replica: 0

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'node'
    scheme: https
    basic_auth:
      username: prometheus
      password: ahmad
    tls_config:
      ca_file: /etc/node_exporter/node_exporter.crt
      insecure_skip_verify: true # just for localhost
    static_configs:
      - targets: ['192.168.56.102:9100']
  - job_name: 'sidecar'
    static_configs:
      - targets: ['thanos_sidecar_eu1:19090']
